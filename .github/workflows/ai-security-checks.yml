name: AI Security Class Checks
on:
  push:
    paths: ['ai-security*', 'tests/ai-security.test.cjs', '.github/workflows/ai-security-checks.yml']
  pull_request:
    paths: ['ai-security*', 'tests/ai-security.test.cjs', '.github/workflows/ai-security-checks.yml']
permissions:
  contents: read
jobs:
  class-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ai-security.js
      - run: node --test tests/ai-security.test.cjs
