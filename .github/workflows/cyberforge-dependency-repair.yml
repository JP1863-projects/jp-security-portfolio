name: CyberForge dependency repair
on:
  push:
    branches: [feature/cyberforge-academy]
    paths:
      - 'cyberforge/package.json'
      - '.github/workflows/cyberforge-dependency-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberforge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cyberforge-academy
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile and apply nonbreaking security fixes
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit synchronized lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'fix(cyberforge): regenerate audited dependency lockfile'
            git push origin HEAD:feature/cyberforge-academy
      - name: Audit repaired dependency graph
        run: npm audit --audit-level=high
          fi
