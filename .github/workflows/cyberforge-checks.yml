name: CyberForge checks
on:
  pull_request:
    paths:
      - 'cyberforge/**'
      - '.github/workflows/cyberforge-checks.yml'
  push:
    paths:
      - 'cyberforge/**'
      - '.github/workflows/cyberforge-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cyberforge/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:vinext
      - name: Guest demo HTTP smoke test
        run: |
          npm run start:vinext -- --host 127.0.0.1 > /tmp/cyberforge-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /tmp/cyberforge-home.html; then break; fi
            sleep 2
          done
          grep -q 'CyberForge' /tmp/cyberforge-home.html
          for route in /dashboard /labs /flashcards /leaderboard /learn/security-architecture; do
            curl --fail --silent --show-error "http://127.0.0.1:4173$route" -o /dev/null
          done
  security-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cyberforge/package-lock.json
      - run: npm ci
      - name: Audit production dependency surface
        run: npm audit --omit=dev --audit-level=high
      - name: Report build-tool advisories (upstream picomatch has no patched release)
        run: npm audit --audit-level=high --json > /tmp/cyberforge-full-audit.json || true
